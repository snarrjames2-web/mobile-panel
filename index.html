<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Workspace</title>
    <style>
        body {
            margin: 0;
            background: #121212;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }
        /* Main Executor Panel */
        #panel {
            width: 90%;
            max-width: 320px;
            background: rgba(25, 25, 25, 0.95);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 12px;
            position: absolute;
            top: 40px;
            left: 5%;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            z-index: 9999;
        }
        .header { 
            display: flex; 
            justify-content: space-between; 
            color: #ff0055; 
            font-family: sans-serif; 
            font-weight: bold; 
            margin-bottom: 8px; 
            border-bottom: 1px solid #333; 
            padding-bottom: 4px; 
            cursor: move; 
            touch-action: none;
        }
        textarea { 
            width: 100%; 
            height: 140px; 
            background: #0c0c0c; 
            color: #00ff66; 
            border: 1px solid #444; 
            border-radius: 6px; 
            padding: 8px; 
            box-sizing: border-box; 
            font-family: monospace; 
            resize: none; 
        }
        .btn-group {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
        button { 
            flex: 1; 
            background: #ff0055; 
            color: white; 
            border: none; 
            padding: 12px; 
            border-radius: 6px; 
            font-weight: bold; 
            cursor: pointer;
        }
        button.minimize {
            background: #333;
        }

        /* Draggable Square Toggle Button */
        #toggle-box {
            width: 50px;
            height: 50px;
            background: #ff0055;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            position: absolute;
            top: 40px;
            right: 20px;
            display: none; /* Hidden by default until panel minimizes */
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 16px rgba(0,0,0,0.6);
            cursor: move;
            z-index: 10000;
            touch-action: none;
        }
        #toggle-box svg {
            width: 24px;
            height: 24px;
            fill: white;
        }
    </style>
</head>
<body>

    <!-- Main Panel -->
    <div id="panel">
        <div class="header" id="panelDragHandle">
            <span>Mobile Interface</span>
            <span style="font-size:11px;color:#666;">v1.0</span>
        </div>
        <textarea id="inputBox" placeholder="-- Paste mobile script text..."></textarea>
        <div class="btn-group">
            <button class="minimize" onclick="toggleMenu(true)">Minimize</button>
            <button onclick="runCommand()">EXECUTE</button>
        </div>
    </div>

    <!-- Draggable Square Box (Icon to open) -->
    <div id="toggle-box" id="squareDragHandle">
        <!-- SVG Gear/Logo Icon Inside Square -->
        <svg viewBox="0 0 24 24">
            <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/>
        </svg>
    </div>

    <script>
        let box = document.getElementById("panel");
        let handle = document.getElementById("panelDragHandle");
        let toggleBox = document.getElementById("toggle-box");
        
        let offX = 0, offY = 0;

        // --- Drag Logic for Main Panel ---
        handle.addEventListener("touchstart", function(e) {
            let t = e.touches[0];
            offX = t.clientX - box.offsetLeft;
            offY = t.clientY - box.offsetTop;
        }, { passive: true });

        handle.addEventListener("touchmove", function(e) {
            let t = e.touches[0];
            box.style.left = (t.clientX - offX) + "px";
            box.style.top = (t.clientY - offY) + "px";
        }, { passive: true });

        // --- Drag Logic for Floating Square Button ---
        toggleBox.addEventListener("touchstart", function(e) {
            let t = e.touches[0];
            offX = t.clientX - toggleBox.offsetLeft;
            offY = t.clientY - toggleBox.offsetTop;
            toggleBox.setAttribute('data-dragging', 'false');
        }, { passive: true });

        toggleBox.addEventListener("touchmove", function(e) {
            let t = e.touches[0];
            toggleBox.style.left = (t.clientX - offX) + "px";
            toggleBox.style.top = (t.clientY - offY) + "px";
            toggleBox.setAttribute('data-dragging', 'true');
        }, { passive: true });

        // Open menu on tap (only if not dragged)
        toggleBox.addEventListener("touchend", function(e) {
            if (toggleBox.getAttribute('data-dragging') === 'false') {
                toggleMenu(false);
            }
        });

        // --- Show / Hide Logic ---
        function toggleMenu(minimize) {
            if (minimize) {
                box.style.display = "none";
                toggleBox.style.display = "flex";
            } else {
                box.style.display = "block";
                toggleBox.style.display = "none";
            }
        }

        function runCommand() {
            let txt = document.getElementById("inputBox").value;
            if(!txt.trim()) return alert("No input provided!");
            alert("Executing: " + txt);
        }
    </script>
</body>
</html>
